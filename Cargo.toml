[package]
name = "whouse"
version = "0.1.0"
edition = "2024"
description = "btop-style TUI showing which processes are reading, writing and opening a path"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
ratatui = "0.30.2"
unicode-width = "0.2.2"

[profile.release]
lto = "thin"
strip = true
